<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tman - Portfolio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
            color: #f8fafc;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .name-container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            text-align: center;
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-top: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
</head>
<body>

    <div class="name-container">
        <h1>Tman</h1>
        <p>Scroll, Zoom, or Click to roll the D20</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.prepend(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 2. D20 Visuals & Geometry
        const diceGroup = new THREE.Group();
        const icoGeo = new THREE.IcosahedronGeometry(1.2, 0);
        const redMat = new THREE.MeshStandardMaterial({ 
            color: 0xe63946,
            flatShading: true,
            roughness: 0.4,
            metalness: 0.1
        });
        const diceMesh = new THREE.Mesh(icoGeo, redMat);
        diceMesh.castShadow = true;
        diceGroup.add(diceMesh);

        // 3. D20 Physics Setup (FOOLPROOF EXTRACTION)
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        const diceMat = new CANNON.Material('dice');
        const wallMat = new CANNON.Material('wall');
        world.addContactMaterial(new CANNON.ContactMaterial(diceMat, wallMat, { friction: 0.3, restitution: 0.5 }));

        // Force non-indexed geometry to guarantee attributes exist
        const safeGeo = icoGeo.toNonIndexed();
        const posAttr = safeGeo.attributes.position;

        const cannonVerts = [];
        const cannonFaces = [];

        for (let i = 0; i < posAttr.count; i++) {
            cannonVerts.push(new CANNON.Vec3(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i)));
        }
        
        for (let i = 0; i < posAttr.count; i += 3) {
            cannonFaces.push([i, i + 1, i + 2]);
        }

        const diceShape = new CANNON.ConvexPolyhedron({
            vertices: cannonVerts,
            faces: cannonFaces
        });

        const diceBody = new CANNON.Body({ mass: 1, material: diceMat });
        diceBody.addShape(diceShape);
        diceBody.position.set(0, 3, 3);
        world.addBody(diceBody);

        // 4. Attach Numbers to D20 Faces (100% INDEX-FREE)
        function createNumberTexture(num) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, 256, 256);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 140px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            if (num === 6 || num === 9) {
                ctx.fillText(num.toString(), 128, 110);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.moveTo(70, 180);
                ctx.lineTo(186, 180);
                ctx.stroke();
            } else {
                ctx.fillText(num.toString(), 128, 128);
            }
            
            return new THREE.CanvasTexture(canvas);
        }

        // Read directly from the safe, non-indexed position array
        const safePosAttr = safeGeo.attributes.position;

        for (let i = 0; i < 20; i++) {
            // Every 3 vertices make one triangle face
            const idxA = i * 3;
            const idxB = i * 3 + 1;
            const idxC = i * 3 + 2;

            const vA = new THREE.Vector3().fromBufferAttribute(safePosAttr, idxA);
            const vB = new THREE.Vector3().fromBufferAttribute(safePosAttr, idxB);
            const vC = new THREE.Vector3().fromBufferAttribute(safePosAttr, idxC);

            const center = new THREE.Vector3().addVectors(vA, vB).add(vC).divideScalar(3);
            
            const edge1 = new THREE.Vector3().subVectors(vB, vA);
            const edge2 = new THREE.Vector3().subVectors(vC, vA);
            const normal = new THREE.Vector3().crossVectors(edge1, edge2).normalize();

            const textMat = new THREE.MeshBasicMaterial({ 
                map: createNumberTexture(i + 1), 
                transparent: true, 
                depthWrite: false 
            });
            const planeGeo = new THREE.PlaneGeometry(0.55, 0.55);
            const textMesh = new THREE.Mesh(planeGeo, textMat);
            
            textMesh.position.copy(center).add(normal.clone().multiplyScalar(0.015));
            
            const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
            textMesh.quaternion.copy(quat);
            
            diceGroup.add(textMesh);
        }

        scene.add(diceGroup);

        // 5. Invisible Walls
        const walls = [];
        const DICE_HALF_SIZE = 1.2; 
        const WALL_PADDING = 0.5;   

        function setupWalls() {
            walls.forEach(w => world.removeBody(w));
            walls.length = 0;
            
            const vFOV = camera.fov * Math.PI / 180;
            const height = 2 * Math.tan(vFOV / 2) * camera.position.z;
            const width = height * camera.aspect;

            const leftX   = -width/2  + DICE_HALF_SIZE + WALL_PADDING;
            const rightX  =  width/2  - DICE_HALF_SIZE - WALL_PADDING;
            const topY    =  height/2 - DICE_HALF_SIZE - WALL_PADDING;
            const bottomY = -height/2 + DICE_HALF_SIZE + WALL_PADDING;
            
            const frontZ = 5; 
            const backZ  = -5; 

            const addWall = (x, y, z, rx, ry, rz) => {
                const body = new CANNON.Body({ mass: 0, material: wallMat });
                body.addShape(new CANNON.Plane());
                body.position.set(x, y, z);
                body.quaternion.setFromEuler(rx, ry, rz);
                world.addBody(body);
                walls.push(body);
            };

            addWall(leftX,   0, 0, 0,  Math.PI/2, 0);  
            addWall(rightX,  0, 0, 0, -Math.PI/2, 0);  
            addWall(0, topY,    0,  Math.PI/2, 0, 0);  
            addWall(0, bottomY, 0, -Math.PI/2, 0, 0);  
            
            addWall(0, 0, frontZ, 0, Math.PI, 0);       
            addWall(0, 0, backZ,  0, 0, 0);
        }
        setupWalls();

        // 6. Interactions
        let lastScroll = window.scrollY;
        
        window.addEventListener('scroll', () => {
            const delta = window.scrollY - lastScroll;
            lastScroll = window.scrollY;
            if (Math.abs(delta) > 10) {
                diceBody.applyTorque(new CANNON.Vec3(delta * 1., delta * 1., 0));
                diceBody.applyForce(new CANNON.Vec3(0, 0, -delta * 1), diceBody.position);
                diceBody.wakeUp();
            }
        });

        window.addEventListener('wheel', (e) => {
            const force = e.deltaY * 0.5;
            diceBody.applyImpulse(new CANNON.Vec3(
                (Math.random() - 0.5) * 10,
                Math.abs(force) * 0.3,
                force * 0.5
            ), diceBody.position);
            diceBody.applyTorque(new CANNON.Vec3(force * 2, force, 0));
            diceBody.wakeUp();
        }, { passive: true });

        window.addEventListener('click', () => {
            diceBody.applyImpulse(new CANNON.Vec3(
                (Math.random() - 0.5) * 20,
                10,
                (Math.random() - 0.5) * 20
            ), diceBody.position);
            diceBody.wakeUp();
        });

        let lastTouchDistance = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const currentDistance = Math.sqrt(dx * dx + dy * dy);
                
                if (lastTouchDistance > 0) {
                    const zoomDelta = currentDistance - lastTouchDistance;
                    if (Math.abs(zoomDelta) > 5) {
                        diceBody.applyImpulse(new CANNON.Vec3(
                            (Math.random() - 0.5) * 15,
                            zoomDelta * 0.3,
                            (Math.random() - 0.5) * 15
                        ), diceBody.position);
                        diceBody.applyTorque(new CANNON.Vec3(
                            zoomDelta * 0.5,
                            zoomDelta * 0.3,
                            zoomDelta * 0.2
                        ));
                        diceBody.wakeUp();
                    }
                }
                lastTouchDistance = currentDistance;
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            lastTouchDistance = 0;
        }, { passive: true });

        // 7. Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            diceBody.applyForce(new CANNON.Vec3(
                (Math.random() - 0.5) * 0.2,
                0,
                (Math.random() - 0.5) * 0.2
            ), diceBody.position);

            world.step(1 / 60, delta, 3);

            diceGroup.position.copy(diceBody.position);
            diceGroup.quaternion.copy(diceBody.quaternion);

            renderer.render(scene, camera);
        }
        animate();

        // 8. Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            setupWalls();
        });
    </script>
</body>
</html>
